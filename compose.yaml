services:
    db:
        build:
            context: .
            dockerfile: db.Dockerfile
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${PGDATABASE:?Set PGDATABASE in .env}
            POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
            PGDATABASE: ${PGDATABASE:?Set PGDATABASE in .env}
            PGUSER: ${PGUSER:?Set PGUSER in .env}
            PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
        env_file:
            - .env
        ports:
            - '127.0.0.1:${PGPORT:-5433}:5432'
        volumes:
            - db-data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    api:
        build:
            context: .
            dockerfile: api.Dockerfile
        restart: unless-stopped
        environment:
            DATA_SOURCE: ${DATA_SOURCE:-json}
            PGHOST: db
            PGPORT: ${PGPORT:?Set PGPORT in .env}
            PGDATABASE: ${PGDATABASE:?Set PGDATABASE in .env}
            PGUSER: ${PGUSER:?Set PGUSER in .env}
            PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
            NODE_OPTIONS: --max-old-space-size=4096
        env_file:
            - .env
        depends_on:
            db:
                condition: service_healthy
        ports: 
            - 8765:8765
        volumes:
            - ./api/data:/api/data:ro
        
    app:
        build:
            context: .
            dockerfile: app.Dockerfile
        restart: unless-stopped
        profiles:
            - prod
        ports:
            - 8087:80
        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./app/index.html:/app/index.html:ro

volumes:
    db-data:
